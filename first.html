<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,
        *::after,
        *::before {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        nav{
            width:100%;
            height:10vh;
            background-color:rgba(51, 51, 51);
            display: flex;
            justify-content:space-around;
            align-items: center;
            position: relative;

        }
        .logo{
            width:300px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: 400;
            margin-left: 40px;
            color:white;
            
        }
        .ul{
            background-color: grey;
            padding:5px;
            display: flex;
            align-items: center;
            justify-content: center;
            width:700px;
            height: 100%;
            
        }
        .li{
           margin-left:20px;
           list-style-type: none;
           padding:5px 15px;

        }
        .link{
            text-decoration: none;
            color: white;
            font-size: 23px;
        }
        span{
               background-color: white;
               width:50px;
               height:50px;
               display: flex;
               justify-content: center;
               align-items: center;
               display: none;
            }
            #img{
                width:40px;
                height:40px;
            }
            @media screen and (max-width:640px){
                 nav{
                    position: relative;
                 }
                 .ul{
                    position: absolute;
                    top:10vh;
                    width:100%;
                    display: block;
                    height: auto;
                 }
            }
      
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            GFG
        </div>
        <ul class="ul">
            <li class="li"><a href="" class="link">Home</a></li>
            <li class="li"><a href="" class="link">About</a></li>
            <li class="li"><a href="" class="link">Serivces</a></li>
            <li class="li"><a href="" class="link">Contact</a></li>
        </ul>
        <style>
            
        </style>
    </nav>
       
</body>

</html>
