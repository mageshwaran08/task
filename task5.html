<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task 5</title>

    <style>
 * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
          body {
            background-color: #e9e4e4;
            font-family: Arial, Helvetica, sans-serif
        }
        .container {
            width: 90%;
            max-width: 1220px;
            margin: 30px auto ;
            padding: 30px;
            background-color: rgb(255, 255, 255);
            border-radius: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 25px;
            }
             .image-box {
            width: 100%;
            height: 405px;
            border-radius: 20px;
            overflow: hidden;
             }
            .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
         .card {
            background-color: #f5f5f5;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
         .card h2 {
            color: #123f60;
            font-size: 25px;
            margin-bottom: 18px;
        }
         .card p {
            color: #555;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 20px;
        }
        .btn {
            width: fit-content;
            padding: 12px 30px;
            background-color: #123f60;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-size: 14px;
        }
         @media screen and (max-width: 900px) {
            .container {
                width: 90%;
                grid-template-columns: 1fr 1fr;
                gap: 25px;
            }
            .image-box {
                grid-column: 1 / 3;
                height: 350px;
            }
            .card {
                min-height: 250px;
            }
            .card h2 {
                font-size: 23px;
            }
            .card p {
                font-size: 15px;
            }
        }
        @media screen and (max-width: 600px) {
            .container {
                width: 95%;
                margin: 15px auto;
                padding: 15px;
                grid-template-columns: 1fr;
                gap: 15px;
                border-radius: 15px;
            }
            .image-box {
                grid-column: auto;
                width: 100%;
                height: 250px;
                border-radius: 15px;
            }
            .card {
                min-height: 230px;
                padding: 25px;
                border-radius: 15px;
            }
            .card h2 {
                font-size: 21px;
            }
            .card p {
                font-size: 14px;
                line-height: 1.6;
            }
            .btn {
                padding: 11px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-box">
            <img src="WebImage .jpeg" alt="Web Development">
        </div>
        <div class="card">
            <h2>Web Development</h2>
            <p>
                Learn HTML, CSS and JavaScript with practical
                projects and responsive website development.
            </p>
            <a href="" class="btn">Learn More</a>
        </div>
        <div class="card">
            <h2>Responsive Design</h2>
            <p>
                Create websites that automatically adjust their
                layout according to desktop, tablet and mobile
                screens.
            </p>
            <a href="" class="btn">Explore</a>
        </div>
    </div>
</body>
</html>
