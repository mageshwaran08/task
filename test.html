<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        nav{
            width:100%;
            height:10vh;
            background-color: aqua;
            display: flex;
        }
        .edu-pro{
             width:250px;
             height:100%;
             /* background-color: green;  */
             display: flex;
             justify-content: center;
             align-items: center; 
        }
        .edu-pro img{
            width:50px;
            height: 50px;
            
        }
        .edu-pro span{
            font-size: 30px;
            font-weight: 600;
            margin-left: 15px;
            font-family: sans-serif;
        }
        .ul{
            /* background-color: red; */
            width:600px;
            height: 100%;
            padding: 5px;
            display: flex;
            align-items: center;
        }
        .ul > li{
            /* background-color: orange; */
            /* border:1px solid black; */
            list-style-type: none;
            padding: 15px 20px;
        }
        .link{
            /* background-color: rgb(217, 0, 255); */
            text-decoration: none;
            
        }
        .request-btn{
            width:300px;
            height: 100%;
            /* background-color: yellow; */
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
        }
        .request-btn > i{
            /* background-color: red; */
            width:50px;
            height:50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 23px;
            color: black;
        }
        .request-btn > button{
             background-color: #0168f9;
             font-size: 20px;
             padding: 13px 25px;
             border: none;
             color: whitesmoke;
             border-radius: 15px;
             margin-left: 10px;
        }

    </style>
</head>
<body>
    <nav>
        <div class="edu-pro">
            <img  src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzKoMwJAW8qg_mm7-k0gNwcWManSEtdmXa_W44_e5ctg&s=10" alt="">
            <span>EduPro</span>
        </div>
        <ul class="ul">
            <li><a href="" class="link">Home</a></li>
            <li><a href="" class="link">About</a></li>
            <li><a href="" class="link">Course</a></li>
            <li><a href="" class="link">Blog</a></li>
            <li><a href="" class="link">Contact</a></li>
        </ul>
        <div class="request-btn">
            <i class="fa-solid fa-magnifying-glass"></i>
            <button>Get Started</button>
        </div>

    </nav>
    
</body>
</html>
