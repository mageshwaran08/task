<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Corporate</title>
    <link rel="stylesheet" href="style.css">
    <style>
    *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: Arial, Helvetica, sans-serif;
}
.navbar {
    width: 100%;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10%;
    background-color: #1d1f2b;
}
.logo {
    font-size: 28px;
    font-weight: bold;
    color: rgb(247, 244, 244);
}
.nav-menu {
    display: flex;
    align-items: center;
    gap: 30px;
    list-style: none;
}
.nav-menu li {
    position: relative;
}
.nav-menu a {
    color: rgb(252, 253, 252);
    text-decoration: none;
    font-size: 20px;
}
.nav-menu .active {
    color: #f74526;
}
.search {
    font-size: 40px !important;
}
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
        CARPORATE
        </div>
        <ul class="nav-menu">
            <li><a href="li" class="active">Home</a></li>
            <li><a href="li">About Us</a></li>
            <li><a href="li">Blog </a></li>
            <li><a href="li">Services</a></li>
            <li><a href="li">Team</a></li>
            <li><a href="li">Contact Us</a></li>
            <li><a href="li" class="search">⌕</a></li>
        </ul>
    </nav>

</body>
</html>
