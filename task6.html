<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTech - Responsive Main Box</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #eef2fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
            color: #0f1b3d;
        }
        .main-box {
            max-width: 1200px;
            width: 90%;
            margin: auto;
            display: flex;
            gap: 40px;
            align-items: center;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(37, 99, 235, 0.15);
        }
        .content-area {
            flex: 0 0 60%;
            max-width: 60%;
        }
        .image-area {
            flex: 1;
        }
        .badge {
            display: inline-block;
            background: #e3ecff;
            color: #1d4ed8;
            font-size: 14px;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 18px;
        }
        h1 {
            font-size: 52px;
            line-height: 1.1;
            font-weight: 800;
            margin-bottom: 18px;
        }
        .content-area p {
            font-size: 18px;
            line-height: 1.5;
            color: #4b5775;
            margin-bottom: 26px;
            max-width: 460px;
        }
        .buttons {
            display: flex;
            gap: 14px;
            margin-bottom: 36px;
        }
        .btn {
            font-size: 16px;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 8px;
            border: 2px solid #1565f0;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
         .btn-primary {
            background: #1565f0;
            color: #fff;
        }
        .btn-outline {
            background: #fff;
            color: #1565f0;
        }
        .btn:focus-visible {
            outline: 3px solid #93b8ff;
            outline-offset: 2px;
        }
        .play-icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #1565f0;
            position: relative;
            display: inline-block;
        }
        .play-icon::after {
            content: "";
            position: absolute;
            left: 7px;
            top: 5px;
            border-left: 6px solid #fff;
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
        }
        .stats {
            display: flex;
            align-items: center;
        }
        .stat {
            text-align: center;
            padding: 0 28px;
        }
        .stat:first-child {
            padding-left: 0;
        }
        .stat:last-child {
            padding-right: 0;
        }
        .stat+.stat {
            border-left: 1px solid #d5dbea;
        }
        .stat strong {
            display: block;
            font-size: 28px;
            color: #1565f0;
        }
        .stat span {
            font-size: 14px;
            color: #4b5775;
        }
        .image-area img,
        .image-placeholder {
            width: 100%;
            height: 390px;
            object-fit: cover;
            border-radius: 14px;
            display: block;
        }
        .image-placeholder {
            background: linear-gradient(135deg, #0b1a33 0%, #17345f 60%, #8a5a2b 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            line-height: 1.2;
        }
        .image-placeholder .cap {
            font-size: 40px;
            margin-bottom: 6px;
        }
        @media (max-width: 991px) {
            .main-box {
                flex-direction: column;
                align-items: stretch;
                width: 90%;
                max-width: 700px;
                gap: 28px;
                padding: 32px;
            }
            .content-area {
                flex: none;
                max-width: 100%;
                width: 100%;
            }
            .image-area {
                width: 100%;
            }
            .content-area p {
                max-width: none;
            }
            .image-area img,
            .image-placeholder {
                height: 280px;
            }
        }
        @media (max-width: 767px) {
            .main-box {
                width: 95%;
                max-width: 350px;
                padding: 24px 18px;
                gap: 22px;
            }
            h1 {
                font-size: 34px;
            }
            .content-area p {
                font-size: 15px;
            }
            .buttons {
                flex-direction: column;
                margin-bottom: 26px;
            }
            .btn {
                width: 100%;
            }
            .stat {
                padding: 0 14px;
            }
            .stat strong {
                font-size: 22px;
            }
            .stat span {
                font-size: 12px;
            }
            .image-area img,
            .image-placeholder {
                height: 180px;
                font-size: 20px;
            }
            .image-placeholder .cap {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="main-box">
        <div class="content-area">
            <span class="badge">Welcome to EduTech</span>
            <h1>Learn Today<br>Build Tomorrow</h1>
            <p>Join thousands of students and develop real-world skills with expert-led courses.</p>
            <div class="buttons">
                <a href="#" class="btn btn-primary">Get Started &rarr;</a>
                <a href="#" class="btn btn-outline"><span class="play-icon"></span> Watch Video</a>
            </div>
            <div class="stats">
                <div class="stat"><strong>10K+</strong><span>Students</span></div>
                <div class="stat"><strong>50+</strong><span>Courses</span></div>
                <div class="stat"><strong>95%</strong><span>Success Rate</span></div>
            </div>
        </div>
        <div class="image-area">
            <div class="image-placeholder">
                <div class="cap">🎓</div>
                Online<br>Learning
            </div>
        </div>
    </div>
</body>
</html>
