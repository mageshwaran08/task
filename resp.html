<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Document</title>
    <style>
        *{
          margin: 0px;
          padding: 0px;
          box-sizing: border-box;
        }
        nav{
            width:100%;
            height:10vh;
            background-color: aqua;
            display: flex;
        }
        .edu-pro{
             width:250px;
             height:100%;
             display: flex;
             justify-content: center;
             align-items: center; 
        }
        .edu-pro img{
            width:50px;
            height: 50px;
        }
        .edu-pro span{
            font-size: 30px;
            font-weight: 600;
            margin-left: 15px;
            font-family: sans-serif;
        }
        .ul{
            width:600px;
            height: 100%;
            padding: 5px;
            display: flex;
            align-items: center;
        }
        .ul > li{
            list-style-type: none;
            padding: 15px 20px;
        }
        .link{
            text-decoration: none;
        }
        .request-btn{
            width: 300px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
        }
        .request-btn > i{
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 23px;
            color: black;
        }
        .request-btn > button{
            background-color: #0168f9;
            font-size: 20px;
            padding: 13px 25px;
            border: none;
            color: whitesmoke;
            border-radius: 15px;
            margin-left: 10px;
        }
        .menu-bar{
            width: 50px;
            height: 50px;
            display: none;
        }
        body{
            font-family: Arial, sans-serif;
            background: #f8fbff;
        }
        .hero {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            min-height: 550px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            padding: 60px 50px;
            background: #eff3f7;
        }
        .content {
            width:55%;
        }
        .title {
            color: #086ff7;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 18px;
        }
        .content h1 {
            font-size: 50px;
            color: #111827;
            margin-bottom: 20px;
        }
        .description {
            max-width: 520px;
            color: #555;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .hero-buttons {
            display: flex;
            gap: 16px;
        }
        .btn {
            display: inline-block;
            padding: 14px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }
        .primary {
            background: #087cff;
            color: white;
        }
        .primary:hover {
            background: #0565d6;
        }
        .secondary {
            background: white;
            color: #087cff;
            border: 2px solid #047af8;
        }
        .secondary:hover {
            background: #087cff;
            color: white;
        }
        .hero-image {
            width: 45%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hero-image img {
            width: 100%;
            max-width: 480px;
            display: block;
            border-radius: 15px;
            object-fit: cover;
        }
        @media screen and (max-width: 833px) {
            nav {
                position: relative;
            }
            .menu-bar {
                display: flex;
                justify-content: center;
                align-items: center;
                margin-left: auto;
                margin-right: 20px;
                align-self: center;
                font-size: 28px;
                cursor: pointer;
            }
            .request-btn {
                display: none;
            }
            .ul {
                display: none;
                position: absolute;
                top: 10vh;
                left: 0;
                width: 100%;
                height: auto;
                flex-direction: column;
                align-items: flex-start;
                background-color: aqua;
                z-index: 100;
            }
            .ul.show {
                display: flex;
            }
            .ul > li {
                width: 100%;
            }
        }
        @media screen and (max-width: 900px) {
            .hero {
                flex-direction: column;
                text-align: center;
                padding: 45px 5%;
            }
            .content {
                width: 100%;
            }
            .content h1 {
                font-size: 36px;
            }
            .description {
                font-size: 16px;
                margin-left: auto;
                margin-right: auto;
            }
            .hero-buttons {
                justify-content: center;
                flex-wrap: wrap;
            }
            .hero-image {
                width: 100%;
            }
            .hero-image img {
                max-width: 450px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="edu-pro">
            <img src="PASTE_YOUR_ORIGINAL_BASE64_HERE" alt="">
            <span>EduPro</span>
        </div>
        <ul class="ul">
            <li><a href="" class="link">Home</a></li>
            <li><a href="" class="link">About</a></li>
            <li><a href="" class="link">Course</a></li>
            <li><a href="" class="link">Blog</a></li>
            <li><a href="" class="link">Contact</a></li>
        </ul>
        <div class="request-btn">
            <i class="fa-solid fa-magnifying-glass"></i>
            <button>Get Started</button>
        </div>
        <i id="menu" class="fa-solid fa-bars menu-bar"></i>
    </nav>

    <section class="hero">
        <div class="content">
            <p class="title">LEARN ANYTHING, ANYWHERE</p>
            <h1>
                Build Your Future<br>
                With Better Learning
            </h1>
            <p class="description">
                Join thousands of students and learn new skills
                with our expert instructors.
            </p>
            <div class="hero-buttons">
                <a href="" class="btn primary">Explore Courses</a>
                <a href="" class="btn secondary">Watch Video</a>
            </div>
        </div>
        <div class="hero-image">
            <img src="./Image 2026-09-26 at 7.51.47 AM.jpeg" alt="Student learning">
        </div>
    </section>

    <script>
        const menu = document.getElementById("menu");
        const navLinks = document.querySelector(".ul");

        menu.addEventListener("click", () => {
            navLinks.classList.toggle("show");
        });
    </script>
</body>
</html>
